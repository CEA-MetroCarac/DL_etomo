name: dl_etomo
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.12
  - astra-toolbox=2.2.0
  - tomosipo>=0.6.0
  - numpy>=2.0
  - scipy>=1.15
  - matplotlib>=3.10
  - scikit-image>=0.25
  - tifffile>=2024.1.1
  - tqdm>=4.67
  - jupyterlab>=4.3
  - pip
  - pip:
      # cu118 wheel: astra-toolbox is compiled for CUDA 11.8, and this wheel
      # is backward-compatible with CUDA 12.x drivers (>= 452.39). See README.
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch>=2.4
      - einops>=0.8
